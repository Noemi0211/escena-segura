<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
  aria-label="Escena Segura"
>
  <!--
    Icono propio de la aplicación.

    Por qué es un rombo y no un rombo de peligro: el rombo rojo con marco blanco
    es el símbolo normalizado del sistema armonizado europeo (SGA/CLP) para los
    pictogramas de riesgo químico, y esos ficheros se usan tal cual en la unidad
    de pictogramas. Reutilizar aquí ese signo haría que la propia interfaz
    pareciera un pictograma de peligro. La marca de la aplicación se apoya por
    tanto en el rombo geométrico (la forma del símbolo) teñido con el color de
    marca, con el escudo de emergencias cruzando el centro.
  -->
  <defs>
    <linearGradient id="marca" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf" />
      <stop offset="1" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>

  <path
    d="M32 4 58 32 32 60 6 32Z"
    fill="url(#marca)"
    stroke="#0b1620"
    stroke-width="3"
  />

  <path
    d="M32 16 44 20v8c0 8-5 13.5-12 15.5C25 41.5 20 36 20 28v-8Z"
    fill="#0b1620"
    opacity=".92"
  />

  <path
    d="m27 29 4 4 7-8"
    fill="none"
    stroke="url(#marca)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
